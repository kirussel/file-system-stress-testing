name: build

# Compiles and runs the lib/funcs unit test suite on Linux, builds
# clodagh/mkpax, and round-trips a mkpax archive. Deliberately stops short
# of `make all`: the dsk target needs FreeBSD-only disk/mount tooling
# (mdconfig, newfs, BSD mount) that has no Linux equivalent, and
# aibreann/brannagh need the pathstore.h that dsk generates.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            libcjson-dev libarchive-dev

      - name: Install libtap
        run: sh contrib/tap.sh

      - name: Build and test lib
        run: |
          make -C src/lib
          make -C src/lib check

      - name: Build and test funcs
        run: |
          make -C src/funcs KSH=bash
          make -C src/funcs check KSH=bash

      - name: Build clodagh and mkpax
        run: make -C src/clodagh KSH=bash

      - name: Smoke test mkpax archive round-trip
        working-directory: src/clodagh
        run: |
          ./mkpax -c -f "$RUNNER_TEMP/ops.tgz"
          ./mkpax -r -f "$RUNNER_TEMP/ops.tgz" > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: make -C src lint
