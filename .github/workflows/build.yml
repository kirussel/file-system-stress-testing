name: build

# Compiles and runs the lib/funcs unit test suite on Linux, builds
# clodagh/mkpax/aibreann/brannagh, and round-trips a mkpax archive.
# Deliberately stops short of `make all`: the dsk target needs FreeBSD-only
# disk/mount tooling (mdconfig, newfs, BSD mount) that has no Linux
# equivalent. aibreann/brannagh normally get their pathstore.h from dsk, so
# CI compiles them against src/clodagh/pathstore.h instead.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            libcjson-dev libarchive-dev

      - name: Install libtap
        run: sh contrib/tap.sh

      - name: Build and test lib
        run: |
          make -C src/lib
          make -C src/lib check

      - name: Build and test funcs
        run: |
          make -C src/funcs KSH=bash
          make -C src/funcs check KSH=bash

      - name: Build clodagh and mkpax
        run: make -C src/clodagh KSH=bash

      - name: Smoke test mkpax archive round-trip
        working-directory: src/clodagh
        run: |
          ./mkpax -c -f "$RUNNER_TEMP/ops.tgz"
          ./mkpax -r -f "$RUNNER_TEMP/ops.tgz" > /dev/null

      # -o pathstore.h keeps make from regenerating it via the dsk target.
      # The EXIT trap removes the borrowed headers even if a build fails.
      - name: Build aibreann and brannagh
        run: |
          trap 'rm -f src/aibreann/pathstore.h src/brannagh/pathstore.h' EXIT
          for p in aibreann brannagh; do
            cp src/clodagh/pathstore.h src/$p/pathstore.h
            make -C src/$p $p -o pathstore.h KSH=bash
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: make -C src lint
