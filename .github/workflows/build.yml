name: build

# Compiles and runs the lib/funcs unit test suite on Linux. Deliberately
# stops short of `make all`: the dsk/aibreann/brannagh/clodagh targets need
# FreeBSD-only disk/mount tooling (mdconfig, newfs, BSD mount) that has no
# Linux equivalent -- see AGENTS.md item 5.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      - name: Install libtap
        run: sh contrib/tap.sh

      - name: Build and test lib
        run: |
          make -C src/lib
          make -C src/lib check

      - name: Build and test funcs
        run: |
          make -C src/funcs KSH=bash
          make -C src/funcs check KSH=bash

  ubsan:
    # UBSan only, not ASan: bstg_signalj_test deliberately writes to an
    # unmapped/invalid pointer to trigger a real SIGSEGV and exercise the
    # framework's own signal handler. ASan's memset interceptor flags the
    # bad pointer itself and aborts before the real page fault occurs, so
    # the test's handler never runs -- a known ASan/signal-test conflict,
    # not a bug. UBSan doesn't intercept memory calls this way and the
    # suite passes clean under it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool

      - name: Install libtap
        run: sh contrib/tap.sh

      - name: Build and test lib under UBSan
        run: |
          UBFLAGS="-g -fsanitize=undefined -fno-omit-frame-pointer"
          make -C src/lib CFLAGS="-Wall $UBFLAGS" LDFLAGS="-L../lib -lfembot $UBFLAGS"
          make -C src/lib check CFLAGS="-Wall $UBFLAGS" LDFLAGS="-L../lib -lfembot $UBFLAGS"

      - name: Build and test funcs under UBSan
        run: |
          UBFLAGS="-g -fsanitize=undefined -fno-omit-frame-pointer"
          make -C src/funcs KSH=bash CFLAGS="-Wall -I. -I ../lib -DBSTG_BASEDIR=\\\"/mnt\\\" $UBFLAGS" LDFLAGS="-L../funcs -lfembotfuncs -L../lib -lfembot $UBFLAGS"
          make -C src/funcs check KSH=bash CFLAGS="-Wall -I. -I ../lib -DBSTG_BASEDIR=\\\"/mnt\\\" $UBFLAGS" LDFLAGS="-L../funcs -lfembotfuncs -L../lib -lfembot $UBFLAGS"
